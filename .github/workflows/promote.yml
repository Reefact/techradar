name: Promote a draft report

# Action manuelle : remplace le rapport officiel du jour par une version générée dans drafts/.
# Actions > "Promote a draft report" > Run workflow > saisir le chemin, ex. drafts/2026/20261124-0815.html
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Chemin du brouillon (drafts/AAAA/AAAAMMJJ-HHMM.html)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote draft to reports/ and rebuild feed
        env:
          DRAFT: ${{ inputs.draft }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          [[ "$DRAFT" =~ ^drafts/([0-9]{4})/([0-9]{8})-[0-9]{4}\.html$ ]] || { echo "Chemin invalide : $DRAFT"; exit 1; }
          year="${BASH_REMATCH[1]}"; day="${BASH_REMATCH[2]}"
          [ -f "$DRAFT" ] || { echo "Introuvable : $DRAFT"; exit 1; }
          mkdir -p "reports/$year"
          cp "$DRAFT" "reports/$year/$day.html"
          python3 tools/build_feed.py
          git config user.name "techradar-bot"
          git config user.email "techradar-bot@users.noreply.github.com"
          git add "reports/$year/$day.html" feed.xml
          git commit -m "Promote $DRAFT to reports/$year/$day.html"
          git push

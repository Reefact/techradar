name: Memory and checks

# À chaque push sur main touchant les fichiers du jour ou la configuration :
#  - contrôle de la configuration et des fichiers du jour (visible dans l'onglet Actions) ;
#  - régénération de data/memory.json (mémoire de la veille), commitée si elle a changé.
on:
  push:
    branches: [main]
    paths:
      - "data/days/**"
      - "config/**"
      - "tools/build_memory.py"
      - "tools/veille_lib.py"
      - "tools/check_day.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: python3 tools/check_config.py
      - name: Check daily files
        run: python3 tools/check_day.py data/days/*/*.json --partiel
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/memory.json
        run: python3 tools/build_memory.py
      - name: Commit data/memory.json if changed
        run: |
          if [ -n "$(git status --porcelain -- data/memory.json)" ]; then
            git config user.name "techradar-bot"
            git config user.email "techradar-bot@users.noreply.github.com"
            git add data/memory.json
            git commit -m "Update data/memory.json"
            git push
          fi

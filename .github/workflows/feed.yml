name: Regenerate Atom feed

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "tools/build_feed.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml
        # Définir la variable de dépôt SITE_URL (Settings > Variables) pour des liens absolus dans le flux.
        run: python3 tools/build_feed.py "${{ vars.SITE_URL }}"
      - name: Commit feed.xml if changed
        run: |
          if ! git diff --quiet -- feed.xml; then
            git config user.name "techradar-bot"
            git config user.email "techradar-bot@users.noreply.github.com"
            git add feed.xml
            git commit -m "Update feed.xml [skip ci]"
            git push
          fi

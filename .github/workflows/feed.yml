name: Regenerate feed and memory

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "tools/build_feed.py"
      - "tools/build_memory.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml
        # Définir la variable de dépôt SITE_URL (Settings > Variables) pour des liens absolus dans le flux.
        run: python3 tools/build_feed.py "${{ vars.SITE_URL }}"
      - name: Build data/memory.json
        run: python3 tools/build_memory.py
      - name: Commit feed.xml and data/memory.json if changed
        run: |
          if [ -n "$(git status --porcelain -- feed.xml data/memory.json)" ]; then
            git config user.name "techradar-bot"
            git config user.email "techradar-bot@users.noreply.github.com"
            git add feed.xml data/memory.json
            git commit -m "Update feed.xml and data/memory.json"
            git push
          fi
